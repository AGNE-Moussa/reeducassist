# Installe le hook commit-msg en plus du hook pre-commit habituel
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Vérifie le format Conventional Commits du message de commit
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --strict
          - --scopes=backend,ai-service,frontend,infra,docs,ci,claude
          - feat
          - fix
          - test
          - docs
          - refactor
          - perf
          - chore
          - ci
          - build

  # Les autres hooks (ruff, prettier, détection de secrets) sont ajoutés dans RA-026
